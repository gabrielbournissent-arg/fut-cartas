* { box-sizing: border-box; }
:root {
  --pitch-dark: #0E2A1F;
  --pitch-mid: #12331F;
  --pitch-line: rgba(242,239,228,0.14);
  --chalk: #F2EFE4;
  --chalk-dim: rgba(242,239,228,0.6);
  --floodlight: #FFD166;
  --ember: #E4572E;
  --silver: #C7CCD6;
  --gold: #FFD166;
}
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: var(--chalk);
  background:
    radial-gradient(circle at 15% 10%, rgba(255,209,102,0.06), transparent 40%),
    repeating-linear-gradient(90deg, var(--pitch-mid) 0px, var(--pitch-mid) 60px, var(--pitch-dark) 60px, var(--pitch-dark) 120px),
    var(--pitch-dark);
  min-height: 100vh;
}
#app { max-width: 640px; margin: 0 auto; padding: 28px 16px 60px; }

.eyebrow { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--floodlight); display:flex; align-items:center; gap:8px; }
.eyebrow::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--floodlight); box-shadow:0 0 8px var(--floodlight); }
.h1 { font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase; font-size:34px; line-height:1.05; margin:6px 0 4px; }
.sub { color:var(--chalk-dim); font-size:14.5px; margin-bottom:22px; line-height:1.5; }

.panel { background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border:1px solid var(--pitch-line); border-radius:14px; padding:22px; margin-bottom:16px; }

.btn { font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; font-size:15px; border:none; border-radius:9px; padding:14px 20px; cursor:pointer; width:100%; }
.btn-primary { background:var(--floodlight); color:#1A1200; box-shadow:0 6px 0 #B8951F; }
.btn-ghost { background:transparent; color:var(--chalk); border:1.5px solid var(--pitch-line); }
.btn:disabled { opacity:0.4; cursor:not-allowed; }

.input { width:100%; background:rgba(0,0,0,0.25); border:1.5px solid var(--pitch-line); border-radius:8px; padding:12px 14px; color:var(--chalk); font-size:15px; margin-bottom:12px; outline:none; }
.input:focus { border-color:var(--floodlight); }
.label { font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--chalk-dim); margin-bottom:6px; display:block; font-family:'Space Mono',monospace; }

.tabs { display:flex; gap:8px; margin-bottom:18px; }
.tab { flex:1; text-align:center; padding:10px; border-radius:8px; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px; cursor:pointer; border:1.5px solid var(--pitch-line); color:var(--chalk-dim); }
.tab.active { border-color:var(--floodlight); color:var(--floodlight); background:rgba(255,209,102,0.08); }

.err { color:#FF8A73; font-size:13px; margin:-4px 0 12px; }
.ok { color:#7CE0A6; font-size:13px; margin:-4px 0 12px; }

.stat-cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.stat-card { background:rgba(0,0,0,0.25); border:1px solid var(--pitch-line); border-radius:12px; padding:14px; text-align:center; }
.stat-card .num { font-family:'Space Mono',monospace; font-weight:700; font-size:26px; color:var(--floodlight); }
.stat-card .lbl { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--chalk-dim); margin-top:2px; }

.card-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.mini-card { background:linear-gradient(160deg,#17402A,#0E2A1F); border:1px solid rgba(255,209,102,0.2); border-radius:10px; padding:12px; }
.mini-card.rareza-plata { border-color: var(--silver); box-shadow: 0 0 0 1px var(--silver); }
.mini-card.rareza-oro { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.mini-name { font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; text-transform:uppercase; }
.mini-team { font-size:10px; color:var(--chalk-dim); font-family:'Space Mono',monospace; text-transform:uppercase; margin-bottom:6px; }
.mini-stats { display:flex; flex-wrap:wrap; gap:4px; }
.mini-stat { font-size:10px; font-family:'Space Mono',monospace; background:rgba(0,0,0,0.25); padding:2px 6px; border-radius:4px; color:var(--chalk-dim); }

.small-note { font-size:12px; color:var(--chalk-dim); text-align:center; margin-top:10px; line-height:1.5; }
.top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.logout-link { font-size:12px; color:var(--chalk-dim); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:'Inter',sans-serif; }
.link-small { font-size:12px; color:var(--chalk-dim); text-decoration:underline; cursor:pointer; text-align:center; display:block; margin-top:8px; }
.spinner { text-align:center; padding:60px 0; color:var(--chalk-dim); font-family:'Space Mono',monospace; }
.badge-admin { display:inline-block; font-family:'Space Mono',monospace; font-size:10px; background:var(--ember); color:var(--chalk); padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
async function getDeckPoolConfig(){
  try {
    const snap = await getDoc(doc(db, 'config', 'deckSettings'));
    if (snap.exists()) {
      const d = snap.data();
      return { excludedPlayers: Array.isArray(d.excludedPlayers) ? d.excludedPlayers : [] };
    }
  } catch(e) { /* si falla, se usa el pool completo sin exclusiones */ }
  return { excludedPlayers: [] };
}
async function randomStarterDeck(n=20){
  const { excludedPlayers } = await getDeckPoolConfig();
  const pool = REAL_PLAYERS.filter(p => !excludedPlayers.includes(p.name));
  const source = pool.length >= n ? pool : REAL_PLAYERS; // si excluir demasiados dejó el pool muy chico, se completa con todos
  return shuffle(source).slice(0,n).map((c,i) => ({
    id: 'c_' + Date.now().toString(36) + '_' + i,
    name: c.name, team: c.team, pos: c.pos, stats: c.stats, rareza: 'normal'
  }));
}
function normalizeUsername(u){
  return u.trim().toLowerCase().replace(/[^a-z0-9_.]/g, '');
}
function usernameToEmail(u){
  return normalizeUsername(u) + '@' + PLAYER_EMAIL_DOMAIN;
}

    'auth/wrong-password': 'El código o la contraseña son incorrectos.',

  return map[code] || 'Ocurrió un error. Probá de nuevo.';
}

async function loadDeckSettings(){

function renderDeckPoolPanel(settings){
  const excluded = new Set(settings.excludedPlayers);
  const rowsByTeam = {};
  REAL_PLAYERS.slice().sort((a,b) => a.team.localeCompare(b.team) || a.name.localeCompare(b.name)).forEach(p => {
    if (!rowsByTeam[p.team]) rowsByTeam[p.team] = [];
    rowsByTeam[p.team].push(p);
  });
  const wrap = h(`<div class="panel">
    <div class="label" style="margin-bottom:6px;">Mazo de jugadores: habilitación para el sorteo inicial</div>
    <div class="small-note" style="text-align:left; margin:0 0 12px;">Destildá un jugador puntual (ej. Messi) para reservarlo y otorgarlo vos manualmente. Los botones de equipo marcan/desmarcan todas sus filas de una vez.</div>
    <input class="input" id="deck-search" placeholder="Buscar por nombre o equipo…" style="margin-bottom:10px;"/>
    <div id="team-bulk" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;"></div>
    <div style="overflow-x:auto;">
      <table style="width:100%; border-collapse:collapse; font-size:12px; font-family:'Space Mono',monospace; white-space:nowrap;">
        <thead>
          <tr style="border-bottom:1.5px solid var(--pitch-line); color:var(--chalk-dim); text-align:left;">
            <th style="padding:6px 8px;">Habilitado</th>
            <th style="padding:6px 8px;">Nombre</th>
            <th style="padding:6px 8px;">Equipo</th>
            <th style="padding:6px 8px;">Pos</th>
            <th style="padding:6px 8px;">ATA</th>
            <th style="padding:6px 8px;">DEF</th>
            <th style="padding:6px 8px;">PAS</th>
            <th style="padding:6px 8px;">REG</th>
            <th style="padding:6px 8px;">FIS</th>
          </tr>
        </thead>
        <tbody id="deck-table-body"></tbody>
      </table>
    </div>
    ${formError ? `<div class="err">${formError}</div>` : ''}
    ${formOk ? `<div class="ok">${formOk}</div>` : ''}
    <button class="btn btn-ghost" id="dp-save" style="margin-top:12px;" ${busy?'disabled':''}>${busy?'Guardando…':'Guardar selección'}</button>
  </div>`);
  const tbody = wrap.querySelector('#deck-table-body');
  const checkboxes = {}; // name -> input element
  Object.keys(rowsByTeam).sort().forEach(team => {
    rowsByTeam[team].forEach(p => {
      const on = !excluded.has(p.name);
      const row = trFromHtml(`<tr data-search="${(p.name+' '+p.team).toLowerCase()}" style="border-bottom:1px solid var(--pitch-line); color:${on?'var(--chalk)':'var(--chalk-dim)'};">
        <td style="padding:5px 8px;"><input type="checkbox" ${on?'checked':''} data-name="${p.name}"/></td>
        <td style="padding:5px 8px;">${p.name}</td>
        <td style="padding:5px 8px;">${p.team}</td>
        <td style="padding:5px 8px;">${p.pos.slice(0,3).toUpperCase()}</td>
        <td style="padding:5px 8px;">${p.stats.ata}</td>
        <td style="padding:5px 8px;">${p.stats.def}</td>
        <td style="padding:5px 8px;">${p.stats.pas}</td>
        <td style="padding:5px 8px;">${p.stats.reg}</td>
        <td style="padding:5px 8px;">${p.stats.fis}</td>
      </tr>`);
      const cb = row.querySelector('input');
      checkboxes[p.name] = cb;
      cb.onchange = () => {
        if (cb.checked) excluded.delete(p.name); else excluded.add(p.name);
        row.style.color = cb.checked ? 'var(--chalk)' : 'var(--chalk-dim)';
      };
      tbody.appendChild(row);
    });
  });
  wrap.querySelector('#deck-search').oninput = (e) => {
    const term = e.target.value.trim().toLowerCase();
    tbody.querySelectorAll('tr').forEach(row => {
      row.style.display = row.dataset.search.includes(term) ? '' : 'none';
    });
  };
  const bulkWrap = wrap.querySelector('#team-bulk');
  Object.keys(rowsByTeam).sort().forEach(team => {
    const btn = h(`<span class="fc-team-chip" style="font-size:11px;font-family:'Space Mono',monospace;padding:5px 9px;border-radius:14px;border:1.5px solid var(--pitch-line);color:var(--chalk-dim);cursor:pointer;">${team}</span>`);
    btn.onclick = () => {
      const teamPlayers = rowsByTeam[team];
      const allOn = teamPlayers.every(p => checkboxes[p.name].checked);
      teamPlayers.forEach(p => {
        checkboxes[p.name].checked = !allOn;
        checkboxes[p.name].dispatchEvent(new Event('change'));
      });
    };
    bulkWrap.appendChild(btn);
  });
  wrap.querySelector('#dp-save').onclick = async () => {
    formError=''; formOk='';
    busy = true; render(renderHome(currentProfile));
    try {
      const newSettings = { excludedPlayers: Array.from(excluded) };
      await setDoc(doc(db, 'config', 'deckSettings'), newSettings);

    } catch(e) {
      formError = 'No se pudo guardar. Probá de nuevo.';
    }
    busy = false;
    render(renderHome(currentProfile));
  };
  return wrap;
}

// -------- Economía (puntos por victoria) --------
let economyCache = null;
async function getEconomyConfig(){
  if (economyCache) return economyCache;
  try {
    const snap = await getDoc(doc(db, 'config', 'economy'));
    economyCache = snap.exists() ? snap.data() : { pointsPerWin: 1 };
  } catch(e) { economyCache = { pointsPerWin: 1 }; }
  if (!economyCache.pointsPerWin) economyCache.pointsPerWin = 1;
  return economyCache;
}

// -------- Mecánica de rondas dentro de una sala --------
async function pickRandomCardForUid(uid){
  try {
    const snap = await getDoc(doc(db, 'users', uid));
    if (!snap.exists()) return null;
    const cards = snap.data().cards || [];
    if (cards.length === 0) return null;
    return cards[Math.floor(Math.random()*cards.length)];
  } catch(e) { return null; }
}

function buildPairing(players){
  const pool = players.map(p => ({...p}));
  let restingUid = null;
  if (pool.length % 2 === 1) {
    const minBye = Math.min(...pool.map(p => p.byeCount||0));
    const candidates = pool.filter(p => (p.byeCount||0) === minBye);
    const chosen = candidates[Math.floor(Math.random()*candidates.length)];
    restingUid = chosen.uid;
    chosen.byeCount = (chosen.byeCount||0) + 1;
  }
  const activePool = pool.filter(p => p.uid !== restingUid);
  const shuffled = shuffle(activePool);
  const pairs = [];
  for (let i=0; i<shuffled.length; i+=2){
    if (!shuffled[i+1]) break; // seguridad, no debería pasar
    const a = shuffled[i], b = shuffled[i+1];
    const mano = Math.random() < 0.5 ? a.uid : b.uid;
    pairs.push({
      players: [a.uid, b.uid],
      names: { [a.uid]: a.name, [b.uid]: b.name },
      mano, category: null, cardsInPlay: null, winnerUid: null, tie: false, resolved: false, appliedBy: []
    });
  }
  return { pairs, restingUid, updatedPlayers: pool };
}

async function startRoomRound(data, roundNumber){
  const { pairs, restingUid, updatedPlayers } = buildPairing(data.players);
  for (const pair of pairs) {
    const [uidA, uidB] = pair.players;
    const [cardA, cardB] = await Promise.all([pickRandomCardForUid(uidA), pickRandomCardForUid(uidB)]);
    pair.cardsInPlay = { [uidA]: cardA, [uidB]: cardB };
  }
  await updateDoc(doc(db, 'rooms', data.code), {
    round: { number: roundNumber, pairs, restingUid },
    players: updatedPlayers,
  });
}

async function pickDuelCategory(data, pair, category){
  const [uidA, uidB] = pair.players;
  const cardA = pair.cardsInPlay[uidA], cardB = pair.cardsInPlay[uidB];
  let winnerUid = null, tie = false;
  if (!cardA || !cardB) { tie = true; }
  else {
    const valA = cardA.stats[category], valB = cardB.stats[category];
    if (valA > valB) winnerUid = uidA;
    else if (valB > valA) winnerUid = uidB;
    else tie = true;
  }
  const newRound = JSON.parse(JSON.stringify(data.round));
  const idx = newRound.pairs.findIndex(p => p.players[0]===pair.players[0] && p.players[1]===pair.players[1]);
  newRound.pairs[idx].category = category;
  newRound.pairs[idx].winnerUid = winnerUid;
  newRound.pairs[idx].tie = tie;
  newRound.pairs[idx].resolved = true;
  await updateDoc(doc(db, 'rooms', data.code), { round: newRound });
}

async function markDuelApplied(data, pair, myUid){
  try {
    const newRound = JSON.parse(JSON.stringify(data.round));
    const idx = newRound.pairs.findIndex(p => p.players[0]===pair.players[0] && p.players[1]===pair.players[1]);
    if (!newRound.pairs[idx].appliedBy) newRound.pairs[idx].appliedBy = [];
    if (!newRound.pairs[idx].appliedBy.includes(myUid)) newRound.pairs[idx].appliedBy.push(myUid);
    await updateDoc(doc(db, 'rooms', data.code), { round: newRound });
  } catch(e) { /* no crítico */ }
}

const appliedDuelsLocal = new Set();
async function applyDuelResultIfNeeded(data, pair, myUid){
  const key = data.code + '_' + data.round.number + '_' + pair.players.join('-');
  if (appliedDuelsLocal.has(key)) return;
  if (pair.appliedBy && pair.appliedBy.includes(myUid)) { appliedDuelsLocal.add(key); return; }
  appliedDuelsLocal.add(key);
  if (pair.tie) { await markDuelApplied(data, pair, myUid); return; }
  const won = pair.winnerUid === myUid;
  const opponentUid = pair.players.find(u => u !== myUid);
  try {
    if (won) {
      const economy = await getEconomyConfig();
      const updates = { points: increment(economy.pointsPerWin) };
      if (data.config.rewardMode === 'points_cards') {
        const wonCard = pair.cardsInPlay[opponentUid];
        if (wonCard) updates.cards = arrayUnion({ ...wonCard, id: 'c_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1000) });
      }
      await updateDoc(doc(db, 'users', myUid), updates);
      currentProfile.points = (currentProfile.points||0) + economy.pointsPerWin;
    } else {
      if (data.config.rewardMode === 'points_cards') {
        const myCard = pair.cardsInPlay[myUid];
        if (myCard) {
          await updateDoc(doc(db, 'users', myUid), { cards: arrayRemove(myCard) });
          currentProfile.cards = currentProfile.cards.filter(c => c.id !== myCard.id);
          if (currentProfile.cards.length <= MIN_CARDS_FLOOR) {
            try { await updateDoc(doc(db, 'rooms', data.code), { status: 'finished', endReason: 'floor_cards', endReasonName: currentProfile.name }); } catch(e) {}
          }
        }
      }
    }
  } catch(e) { console.error('No se pudo aplicar el resultado del duelo', e); }
  await markDuelApplied(data, pair, myUid);
}

    const row = h(`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;margin-bottom:6px;background:rgba(0,0,0,0.18); ${pickable?'cursor:pointer;':''}">
      <span style="font-size:13px;color:var(--chalk-dim);text-transform:uppercase;">${STAT_LABELS[k]}</span>
      <span style="font-family:'Space Mono',monospace;font-weight:700;font-size:17px;">${card.stats[k]}</span>
    </div>`);
    if (pickable) row.onclick = () => onPick(k);
    statsWrap.appendChild(row);
  });
  return div;
}

function renderDuelReveal(pair, myUid){
  const [uidA, uidB] = pair.players;
  const cat = pair.category;
  const wrap = h(`<div></div>`);
  [uidA, uidB].forEach(uid => {
    const card = pair.cardsInPlay[uid];
    if (!card) return;
    const isWinner = pair.winnerUid === uid;
    wrap.appendChild(h(`<div class="panel" style="${isWinner?'border-color:#4CD97D;box-shadow:0 0 0 1px #4CD97D;':''}">
      <div style="font-size:11px;color:var(--chalk-dim);font-family:'Space Mono',monospace;text-transform:uppercase;margin-bottom:4px;">${pair.names[uid]}${uid===myUid?' (vos)':''}${isWinner?' · GANA':''}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;">${card.name} — ${STAT_LABELS[cat]}</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;font-size:24px;color:${isWinner?'#4CD97D':'var(--floodlight)'};">${card.stats[cat]}</span>
      </div>
    </div>`));
  });
  if (pair.tie) wrap.appendChild(h(`<div class="small-note">¡Empate! No se mueven puntos ni cartas en este duelo.</div>`));
  return wrap;
}

function renderHostRoundControls(data){
  const round = data.round;
  const allResolved = round.pairs.every(p => p.resolved);
  const wrap = h(`<div class="panel"></div>`);
  if (!allResolved) {
    wrap.appendChild(h(`<div class="small-note">Esperando a que todos los duelos de esta ronda terminen…</div>`));
    return wrap;
  }
  const isLastFixedRound = data.config.durationType === 'fixed' && round.number >= data.config.fixedRounds;
  if (isLastFixedRound) {
    const btn = h(`<button class="btn btn-primary">Finalizar sala</button>`);
    btn.onclick = async () => { await updateDoc(doc(db, 'rooms', data.code), { status:'finished' }); };
    wrap.appendChild(btn);
  } else {
    const btn = h(`<button class="btn btn-primary" style="margin-bottom:8px;">Siguiente ronda</button>`);
    btn.onclick = async () => { await startRoomRound(data, round.number + 1); };
    wrap.appendChild(btn);
    if (data.config.durationType === 'open') {
      const closeBtn = h(`<button class="btn btn-ghost">Cerrar sala ahora</button>`);
      closeBtn.onclick = async () => { await updateDoc(doc(db, 'rooms', data.code), { status:'finished' }); };
      wrap.appendChild(closeBtn);
    }
  }
  return wrap;
}

function renderRoomPlaying(data){
  const myUid = auth.currentUser.uid;
  const isHost = data.hostUid === myUid;
  const round = data.round;
  const wrap = h(`<div></div>`);
  wrap.appendChild(h(`<div class="eyebrow">Sala ${data.code} · Ronda ${round ? round.number : '-'}</div>`));
  wrap.appendChild(h(`<div class="h1" style="font-size:26px;">Futcartas</div>`));

  if (!round) {
    wrap.appendChild(h(`<div class="panel"><div class="small-note">Preparando la ronda…</div></div>`));
  } else if (round.restingUid === myUid) {
    playChallengeSound('resting-' + data.code + '-' + round.number);
    wrap.appendChild(h(`<div class="panel"><div class="small-note">Descansás esta ronda — te toca la próxima.</div></div>`));
  } else {
    const pair = round.pairs.find(p => p.players.includes(myUid));
    if (!pair) {
      wrap.appendChild(h(`<div class="panel"><div class="small-note">Esperando la próxima ronda…</div></div>`));
    } else {
      const opponentUid = pair.players.find(u => u !== myUid);
      const isMano = pair.mano === myUid;
      playChallengeSound('duel-' + data.code + '-' + round.number + '-' + pair.players.join('-'));
      wrap.appendChild(h(`<div class="small-note" style="margin-bottom:10px;">Rival: <b style="color:var(--chalk)">${pair.names[opponentUid]}</b>${isMano && !pair.resolved ? ' · Sos la mano, elegí la categoría' : ''}</div>`));
      if (!pair.resolved) {
        const myCard = pair.cardsInPlay[myUid];
        wrap.appendChild(renderDuelCard(myCard, isMano, (k) => pickDuelCategory(data, pair, k)));
        if (!isMano) wrap.appendChild(h(`<div class="small-note">Esperando a que ${pair.names[pair.mano]} elija la categoría…</div>`));
      } else {
        wrap.appendChild(renderDuelReveal(pair, myUid));
        applyDuelResultIfNeeded(data, pair, myUid);
      }
    }
  }

  if (isHost && round) wrap.appendChild(renderHostRoundControls(data));
  const leave = h(`<span class="link-small" id="rp-leave">Salir de la sala</span>`);
  leave.onclick = () => { stopRoomListener(); currentRoomCode=null; currentRoomData=null; screen='home'; render(renderHome(currentProfile)); };
  wrap.appendChild(leave);
  return wrap;
}

function renderRoomFinished(data){
  const floorMsg = data.endReason === 'floor_cards'
    ? `La sala se cerró automáticamente porque ${data.endReasonName || 'un jugador'} llegó al mínimo de ${MIN_CARDS_FLOOR} cartas permitidas — nadie puede quedarse con menos, para que siempre pueda seguir jugando.`
    : 'Buen partido — tus puntos y cartas ya quedaron guardados en tu perfil.';
  const wrap = h(`<div>
    <div class="eyebrow">Sala ${data.code}</div>
    <div class="h1" style="font-size:26px;">La sala terminó</div>
    <div class="panel"><div class="small-note">${floorMsg}</div></div>
    <button class="btn btn-primary" id="rf-back">Volver a mi perfil</button>
  </div>`);
  wrap.querySelector('#rf-back').onclick = () => {
    stopRoomListener();
    currentRoomCode = null; currentRoomData = null;
    screen = 'home'; render(renderHome(currentProfile));
  };
  return wrap;
}

function renderRoomLobby(data){
  const isHost = data.hostUid === auth.currentUser.uid;
  const rewardLabel = data.config.rewardMode === 'points_cards' ? 'Puntos + carta del rival' : 'Solo puntos';
  const durationLabel = data.config.durationType === 'fixed' ? `${data.config.fixedRounds} ronda(s)` : 'Abierta (la cierra el creador)';
  const wrap = h(`<div>
    <div class="eyebrow">Sala de espera</div>
    <div class="h1" style="font-size:28px;">Futcartas</div>
    <div class="code-display" style="font-family:'Space Mono',monospace; font-size:38px; font-weight:700; letter-spacing:0.15em; text-align:center; color:var(--floodlight); background:rgba(0,0,0,0.3); border:2px dashed var(--pitch-line); border-radius:12px; padding:14px 0; margin:10px 0 18px;">${data.code}</div>
    <div class="small-note" style="margin-bottom:16px;">Compartí este código para que se sumen. Premio: <b style="color:var(--chalk)">${rewardLabel}</b> · Duración: <b style="color:var(--chalk)">${durationLabel}</b></div>
    <div class="panel">
      <label class="label">Jugadores (${data.players.length})</label>
      ${data.players.map(p => `<div class="fc-player-row" style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--pitch-line);font-size:14.5px;">
        <span style="width:8px;height:8px;border-radius:50%;background:#4CD97D;box-shadow:0 0 6px #4CD97D;"></span>
        ${p.name}${p.uid===data.hostUid?'<span class="badge-admin" style="background:var(--floodlight);color:#1A1200;">HOST</span>':''}
      </div>`).join('')}
    </div>
    ${isHost ? `<button class="btn btn-primary" id="rl-start" ${data.players.length<2?'disabled':''}>Iniciar sala</button>
    ${data.players.length<2 ? '<div class="small-note">Necesitás al menos 2 jugadores.</div>' : ''}` :
    `<div class="small-note">Esperando a que ${data.hostName} inicie la sala…</div>`}
    <span class="link-small" id="rl-leave">Salir de la sala</span>
  </div>`);
  if (isHost) {
    wrap.querySelector('#rl-start').onclick = async () => {
      await updateDoc(doc(db, 'rooms', data.code), { status: 'playing' });
      await startRoomRound(data, 1);
    };
  }
  wrap.querySelector('#rl-leave').onclick = () => {
    stopRoomListener();
    currentRoomCode = null; currentRoomData = null;
    screen = 'home'; render(renderHome(currentProfile));
  };
  return wrap;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { screen='player-login'; render(renderPlayerLogin()); return; }
  render(h(`<div class="spinner">Cargando tu perfil…</div>`));
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      render(renderHome(snap.data()));
    } else {
      const fallback = {
        uid: user.uid, name: user.displayName || 'Jugador', email: user.email,
        points: 0, role: 'player', blocked: false, blockType: null,
        rating: null, medals: [], cards: await randomStarterDeck(20),
      };
      await setDoc(doc(db, 'users', user.uid), { ...fallback, createdAt: serverTimestamp() });
      render(renderHome(fallback));
    }
  } catch (e) {
    render(h(`<div class="panel"><div class="err">No se pudo cargar tu perfil: ${e.message}</div></div>`));
  }
});
</script>
</body>
</html>
